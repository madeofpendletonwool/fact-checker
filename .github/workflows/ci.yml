name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.2
      - run: golangci-lint run

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: factcheck
          POSTGRES_PASSWORD: factcheck
          POSTGRES_DB: factcheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factcheck -d factcheck_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      FACTCHECK_TEST_DATABASE_URL: postgres://factcheck:factcheck@localhost:5432/factcheck_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
